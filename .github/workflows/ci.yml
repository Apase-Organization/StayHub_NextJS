name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://stayhub:password@localhost:5432/stayhub_db
      APP_LOCAL_URL: http://localhost:8080
      APP_SECRET: ci-secret
      AUTH_SECRET: ci-secret
      AUTH_URL: http://localhost:8080
      NEXTAUTH_URL: http://localhost:8080
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      MAIL_HOST: smtp.example.com
      MAIL_PORT: 587
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-mail-password
      MAIL_FROM: StayHub <noreply@example.com>

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma validate
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
